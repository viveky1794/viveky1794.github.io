<link rel="apple-touch-icon" href="{{ '/user_profile/images/favicon.png' | relative_url }}">

<script>
// Restore the visitor's saved light/dark preference before first paint.
// just-the-docs.js (which defines jtd.setTheme) is guaranteed to have
// already loaded by this point -- see _includes/head.html's include order.
(function() {
  try {
    var saved = localStorage.getItem('jtd-color-scheme');
    if (saved && window.jtd && jtd.setTheme) {
      jtd.setTheme(saved);
    }
  } catch (e) {}
})();
</script>
