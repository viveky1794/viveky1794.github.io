title: "Vivek Yadav — Systems & Embedded Notes"
description: >-
  Embedded systems & Linux internals notes and projects by Vivek Yadav —
  QNX, Linux kernel internals, ARM Cortex-M/A, memory management, caching,
  scheduling, and USB.
url: "https://viveky1794.github.io"
author: "Vivek Yadav"

# Header/sidebar mark (Just the Docs renders this beside the site title)
# and the image jekyll-seo-tag uses for the site's structured-data logo.
logo: "/assets/images/logo.png"

remote_theme: just-the-docs/just-the-docs

# Site code (Sass overrides, include overrides, logo design sources) lives
# under web_backend/ instead of the Jekyll-conventional root locations, so
# content folders (articles/, user_profile/) stay uncluttered at the root.
includes_dir: web_backend/_includes
sass:
  sass_dir: web_backend/_sass

plugins:
  - jekyll-remote-theme
  - jekyll-seo-tag
  - jekyll-sitemap
  - jekyll-feed
  - jekyll-redirect-from

# --- Just the Docs settings ---
search_enabled: true
search:
  heading_level: 3
  previews: 3
  preview_words_before: 5
  preview_words_after: 10
  tokenizer_separator: /[\s/]+/
  rel_url: true
  button: false

nav_enabled: true
heading_anchors: true

back_to_top: true
back_to_top_text: "Back to top"

# Light theme by default; Just the Docs ships a built-in dark-mode toggle.
color_scheme: light

aux_links:
  "Vivek Yadav on LinkedIn":
    - "https://www.linkedin.com/in/viveky1794"
aux_links_new_tab: true

footer_content: "Copyright &copy; 2026 Vivek Yadav. Distributed under the MIT License."

last_edit_timestamp: false
last_edit_time_format: "%b %e, %Y"

gh_edit_link: false

callouts:
  note:
    title: Note
    color: blue
  warning:
    title: Warning
    color: yellow

# GA4 placeholder — replace with your real Measurement ID once you've
# created a GA4 property (see README.md for the steps).
google_analytics: G-XXXXXXXXXX

# jekyll-seo-tag / jekyll-feed pick these up automatically.
twitter:
  card: summary

# README.md and CONTRIBUTING.md are GitHub-facing repo docs, not site pages.
# web_backend/design/ and sources/ are repo-only artifacts (logo design
# deliverables, raw excalidraw/docx working files) -- not meant to be served
# as site pages. articles/_TEMPLATE.md is a starter file, not real content.
exclude:
  - README.md
  - CONTRIBUTING.md
  - Gemfile
  - Gemfile.lock
  - LICENSE
  - zephyr-project/
  - web_backend/design/
  - sources/
  - vendor/
  - node_modules/
  - articles/_TEMPLATE.md
